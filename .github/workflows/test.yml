name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: openpyxl 설치
        run: pip install openpyxl

      - name: 테스트 실행
        working-directory: plugins/gx-pm
        run: python -m unittest discover -s tests -v
